<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Мой Олимп</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header class="appbar" id="appbar"></header>

        <div class="content" id="content"></div>
