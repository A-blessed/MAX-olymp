# Общая часть всех проксирующих location. Подключается внутри location:
#
#     location /api/ {
#         include /etc/nginx/proxy.conf;
#     }
#
# proxy_pass без завершающего слеша отдаёт бэкенду исходный путь целиком:
# /api/me приходит как /api/me, переписывать ничего не нужно.
proxy_pass http://backend;

proxy_http_version 1.1;

# Бэкенд видит настоящий домен и то, что снаружи было https. Без
# X-Forwarded-Proto uvicorn считает соединение обычным http и в редиректах
# подставляет http://, а MAX такие адреса не примет.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Нужен для запросов с апгрейдом соединения.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "";

proxy_redirect off;
