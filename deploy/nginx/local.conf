# nginx для локального запуска: docker compose up --build.
#
# Та же раскладка, что на my-olymp.ru, только без TLS: статика
# мини-приложения и прокси в бэкенд на одном origin. Страница, открытая с
# http://localhost:8080, ходит в API на тот же адрес — в локальный
# бэкенд, а не в боевой.
#
#     /                 статика из frontend/
#     /api/*            бэкенд, авторизация по подписи данных запуска
#     /webhook          бэкенд, события бота от платформы MAX
#     /health           бэкенд, проверка живости
#     /docs, /openapi.json   схема API (открыта при APP_ENV=development)
#
# Этот файл запечён в образ frontend/Dockerfile как конфигурация по
# умолчанию. На сервере docker-compose.prod.yml подменяет его на
# my-olymp.ru.conf.

upstream backend {
    # Имя сервиса из docker-compose.yml.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    root  /srv/frontend;
    index index.html;

    # --- Бэкенд -------------------------------------------------------
    location /api/ {
        include /etc/nginx/proxy.conf;
    }

    location = /webhook {
        include /etc/nginx/proxy.conf;
    }

    location = /health {
        include /etc/nginx/proxy.conf;
    }

    location = /docs {
        include /etc/nginx/proxy.conf;
    }

    location = /openapi.json {
        include /etc/nginx/proxy.conf;
    }

    # --- Статика мини-приложения --------------------------------------
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
